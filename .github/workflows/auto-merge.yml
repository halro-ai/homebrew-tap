name: auto-merge-package-release

on:
  workflow_run:
    workflows: [test-formula]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only the automation-owned release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ toJSON(github.event.workflow_run) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_count=$(jq '.pull_requests | length' <<<"${RUN}")
          [ "${pr_count}" -eq 1 ] || { echo "expected exactly one pull request, got ${pr_count}"; exit 1; }
          pr_number=$(jq -r '.pull_requests[0].number' <<<"${RUN}")
          pr=$(gh pr view "${pr_number}" --repo "${REPOSITORY}" \
            --json state,baseRefName,headRefName,headRepositoryOwner,labels)
          [ "$(jq -r .state <<<"${pr}")" = OPEN ] || exit 0
          [ "$(jq -r .baseRefName <<<"${pr}")" = main ]
          printf '%s' "$(jq -r .headRefName <<<"${pr}")" | grep -Eq '^package/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
          [ "$(jq -r .headRepositoryOwner.login <<<"${pr}")" = "${GITHUB_REPOSITORY_OWNER}" ]
          jq -e '.labels | any(.name == "automated-release")' <<<"${pr}" >/dev/null
          gh pr merge "${pr_number}" --repo "${REPOSITORY}" --squash --delete-branch
