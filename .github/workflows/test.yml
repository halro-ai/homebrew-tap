name: test-formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-control-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ruby scripts/test-workflow-contract.rb

  formula:
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Register the checked-out tap
        run: |
          set -euo pipefail
          tap_root="$(brew --repository)/Library/Taps/halro-ai"
          mkdir -p "${tap_root}"
          ln -s "${GITHUB_WORKSPACE}" "${tap_root}/homebrew-tap"
      - run: brew style halro-ai/tap/halro
      - run: brew audit --strict --formula halro-ai/tap/halro
      - run: brew install halro-ai/tap/halro
      - run: brew test halro-ai/tap/halro
      - run: halro version
      - name: Reinstall the published v0.11.0 formula
        run: |
          set -euo pipefail
          brew reinstall halro-ai/tap/halro
          brew test halro-ai/tap/halro
          halro version >reinstalled-version.json
          grep -F 'v0.11.0' reinstalled-version.json
      - name: Upgrade the published v0.10.1 formula to v0.11.0
        run: |
          set -euo pipefail
          brew uninstall halro-ai/tap/halro
          git show 418312e0cb6dd10d9e865a53e144e1b5338ecd3c:Formula/halro.rb >Formula/halro.rb
          brew install halro-ai/tap/halro
          halro version >previous-version.json
          grep -F 'v0.10.1' previous-version.json
          git checkout HEAD -- Formula/halro.rb
          brew upgrade --formula halro-ai/tap/halro
          brew test halro-ai/tap/halro
          halro version >upgraded-version.json
          grep -F 'v0.11.0' upgraded-version.json
